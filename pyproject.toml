[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "almond"
version = "0.1.0"
description = "Deterministic workforce optimization MVP for Jornada40"
requires-python = ">=3.10"
dependencies = ["ortools>=9.8,<10", "PyYAML>=6.0,<7"]

[project.scripts]
almond = "almond.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
