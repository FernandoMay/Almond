constraints:
  - id: legal.max_weekly_hours
    kind: legal
    hard: true
    rule: Each employee works at most 40 scheduled hours in the modeled week.
    value: 40
    source: Jornada40 product brief
    removal_impact: Removing this constraint can concentrate work above the 40-hour limit and invalidate the challenge scenario.

  - id: operational.availability
    kind: operational
    hard: true
    rule: Assignments may only occur inside employee availability windows.
    value: employee availability intervals
    source: Workforce operating policy
    removal_impact: Removing this constraint can create schedules that employees cannot execute.

  - id: operational.hourly_coverage
    kind: operational
    hard: true
    rule: Every modeled demand bucket should be covered; infeasible uncovered demand is explicitly reported.
    value: scenario demand
    source: Service-level operating target
    removal_impact: Removing this constraint would allow apparent savings through understaffing.

  - id: product.deterministic_demo
    kind: product
    hard: true
    rule: The demo scenario is reproducible from a fixed seed.
    value: seed-controlled dataset generation and deterministic solver configuration
    source: MVP acceptance criterion
    removal_impact: Removing determinism makes results harder to reproduce and audit during the demo.

  - id: product.explainable_output
    kind: product
    hard: true
    rule: Results expose coverage, violations, cost, and constraint evaluations.
    value: required result fields
    source: MVP acceptance criterion
    removal_impact: Removing explainability prevents an operator from auditing why a schedule was produced.

  - id: product.versioned_api_surface
    kind: product
    hard: true
    rule: The local HTTP surface exposes health, deterministic demo, and seed-controlled optimization routes with CLI parity.
    value: GET /health; GET /v1/demo; POST /v1/optimize/demo
    source: First Almond product-surface work unit
    removal_impact: Removing the boundary would leave the verified core without a stable product-facing API contract.
    status: implemented

  - id: product.file_ingestion_export
    kind: product
    hard: true
    rule: JSON and documented CSV scenario files are validated through the existing request/domain path, and optimized schedules export as deterministic CSV.
    value: POST /v1/optimize/json-file; POST /v1/optimize/csv; GET /v1/demo/schedule.csv; POST /v1/optimize/schedule.csv
    source: File workflow work unit
    removal_impact: File consumers could receive ambiguous scenarios or non-reproducible schedule artifacts.
    status: implemented

  - id: product.operational_cli
    kind: product
    hard: true
    rule: The local optimize CLI accepts either one validated JSON scenario or a complete exact-schema CSV bundle and emits deterministic result JSON and optimized schedule CSV without API calls.
    value: almond optimize; optional --result-json and --schedule-csv; stdout fallback for result JSON
    source: Operational CLI work unit
    removal_impact: Operators would need an HTTP runtime for repeatable file-based optimization and could lose deterministic artifact contracts.
    status: implemented

  - id: product.local_operations_dashboard
    kind: product
    hard: true
    rule: The local dashboard presents verified business metrics, constraint explanations, and validation state, and supports demo execution plus JSON scenario upload without duplicating domain logic.
    value: GET /; /static assets; GET /v1/demo; POST /v1/optimize/json-file; GET /v1/demo/schedule.csv
    source: Local operations dashboard work unit
    removal_impact: Operators would need to inspect raw API or CLI output to understand current-versus-optimized cost and schedule validity.
    status: implemented

  - id: product.validated_store_input
    kind: product
    hard: true
    rule: POST /v1/optimize accepts a typed non-empty store scenario with unique employee IDs and demand slots, bounded windows, explicit required staff, and in-horizon values.
    value: Pydantic request models; FastAPI 422 for invalid input
    source: New-store optimization API work unit
    removal_impact: Invalid or ambiguous store input could reach the optimizer and produce unauditable results.
    status: implemented

  - id: product.schedule_visualization
    kind: product
    hard: true
    rule: Dashboard results expose deterministic optimized schedule rows and hourly coverage comparisons with peak, undercoverage, exact-coverage, and overcoverage presentation states.
    value: optimized_schedule and hourly_coverage result fields; weekly table; coverage heatmap and semantic table fallback
    source: Schedule visualization work unit
    removal_impact: Operators would need to reconstruct shift and hourly coverage detail from raw assignments and demand data.
    status: implemented

  - id: implementation.solver
    kind: implementation
    hard: true
    rule: The optimizer uses OR-Tools CP-SAT and fails clearly when unavailable.
    value: OR-Tools CP-SAT
    source: MVP technical direction
    removal_impact: Replacing the solver is possible, but requires preserving the domain constraints and verification contract.

  - id: operational.peak_coverage
    kind: operational
    hard: true
    rule: Explicitly marked peak demand buckets are hard-covered when feasible; infeasible models fall back to bounded, visible peak shortage.
    value: DemandPoint.peak with deterministic demo window 12:00-16:00
    source: Challenge acceptance criterion
    removal_impact: Removing peak coverage can create misleading savings by reducing staffing during high-demand periods.
    status: implemented

  - id: baseline.fixed_floor_policy
    kind: operational
    hard: false
    rule: The current-policy comparison keeps a configurable five-person floor across the full opening interval and rotates employees deterministically by day.
    value: staffing floor 5; shift 08:00-18:00; round-robin rotation
    source: Observed operating-policy assumption for the seed-40 demonstration
    removal_impact: Removing this assumption changes the current-policy comparison and its measured overstaffing, overtime, and savings; it does not relax optimized-schedule verification.

  - id: baseline.coverage_measurement
    kind: measurement
    hard: false
    rule: Baseline analysis reports overall and peak coverage, under/overstaffing, regular/overtime hours, and all observed violations.
    value: schedule-derived metrics using scenario demand and overtime configuration
    source: Workforce comparison auditability requirement
    removal_impact: Removing these measurements could hide an understaffed or overtime-heavy baseline and disconnect savings from operational evidence.

  - id: financial.overtime_economics
    kind: financial
    hard: false
    rule: Weekly hours above the configured threshold are priced at the configured overtime multiplier.
    value: threshold 40 hours, multiplier 1.5 by default
    source: Jornada40 overtime economics work unit
    removal_impact: Removing this rule understates the cost of arbitrary schedules that exceed regular weekly hours.

  - id: product.objective_weights
    kind: product
    hard: false
    rule: Labor cost, normal uncovered demand, and peak uncovered demand use explicit scenario configuration.
    value: 1, 10000, and 20000 by default
    source: Explainable optimization acceptance criterion
    removal_impact: Removing explicit weights makes tradeoffs opaque and prevents deterministic scenario tuning.

  - id: financial.minimum_savings
    kind: product
    hard: false
    rule: The challenge scenario should demonstrate at least 8% labor-cost savings without violating hard constraints.
    value: 8%
    source: Challenge acceptance criterion
    removal_impact: Removing this target changes the business acceptance criterion but does not affect schedule feasibility.
    status: acceptance target; not an implementation assumption or solver objective
