services:
  almond:
    build:
      context: .
    ports:
      - "8000:8000"
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
